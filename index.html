<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FCIIN.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B1B1B;
    --card-border: #2F7A72;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    position: relative;
    margin: 0;
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    padding: 60px 24px 96px;
    background-color: #EDEEF3;
    transition: background-color 0.15s linear;
    overflow-x: hidden;
  }

  header {
    position: relative;
    text-align: center;
    margin-bottom: 64px;
  }

  /* --- Lámpara colgante --- */

  .lamp-anchor {
    position: absolute;
    top: 0;
    left: 50%;
    width: 0;
    height: 0;
  }

  .lamp {
    position: absolute;
    top: 0;
    left: 50%;
    width: 2px;
    height: 78px;
    margin-left: -1px;
    background: var(--ink);
    transform-origin: top center;
    z-index: 5;
  }

  .bulb-wrap {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    cursor: grab;
    padding: 6px 14px 14px;
    touch-action: none;
  }

  .bulb-wrap:active {
    cursor: grabbing;
  }

  .bulb-cap {
    width: 10px;
    height: 7px;
    margin: 0 auto;
    background: #8b8b8b;
    border-radius: 2px 2px 0 0;
  }

  .bulb-glass {
    width: 26px;
    height: 30px;
    margin-top: -1px;
    border-radius: 50% 50% 45% 45%;
    border: 2px solid #9a9a9a;
    background: transparent;
    transition: background-color 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
  }

  body.lamp-on .bulb-glass {
    background: #FFD966;
    border-color: #C99A2E;
    box-shadow: 0 0 16px 6px rgba(255, 214, 102, 0.85);
  }

  /* Haz de luz: triángulo perfecto apuntando según el balanceo */
  .light-cone {
    position: absolute;
    top: 114px;
    left: 50%;
    width: 260px;
    height: 220px;
    margin-left: -130px;
    transform-origin: 50% -114px;
    pointer-events: none;
    opacity: 0;
    z-index: 3;
    clip-path: polygon(46% 0%, 54% 0%, 100% 100%, 0% 100%);
    background: linear-gradient(to bottom,
      rgba(255, 230, 160, 0.95) 0%,
      rgba(255, 215, 100, 0.5) 50%,
      rgba(255, 180, 50, 0) 100%);
    transition: opacity 0.15s ease;
  }

  body.lamp-on .light-cone {
    opacity: 1;
  }

  .lamp.broken {
    height: 20px;
  }

  /* Copia brillante del título (Alineación perfecta 1:1) */
  .logo-glow {
    position: fixed;
    margin: 0;
    padding: 0;
    pointer-events: none;
    z-index: 4;
    color: #FFDE8A;
    text-shadow: 0 0 14px rgba(255, 214, 102, 0.9), 0 0 28px rgba(255, 214, 102, 0.5);
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    letter-spacing: 1px;
    line-height: 1;
    clip-path: inset(0 0 100% 0);
  }

  /* Mensajes escondidos a los lados */
  .side-joke {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: #FFDE8A;
    text-shadow: 0 0 10px rgba(255, 214, 102, 0.9);
    opacity: 0;
    pointer-events: none;
    z-index: 4;
    white-space: nowrap;
    transition: opacity 0.1s ease;
  }

  #sideJokeLeft { right: 100%; margin-right: 14px; }
  #sideJokeRight { left: 100%; margin-left: 14px; }

  .falling-bulb {
    position: absolute;
    top: 0;
    left: 0;
    width: 26px;
    z-index: 50;
    display: none;
  }

  .falling-bulb .broken-wire {
    width: 2px;
    height: 16px;
    margin: 0 auto;
    background: var(--ink);
  }

  /* Monigote */
  .walker {
    position: absolute;
    top: 0;
    left: -40px;
    width: 24px;
    height: 36px;
    z-index: 60;
    display: none;
  }

  .walker svg { width: 100%; height: 100%; overflow: visible; }
  .walker .leg-a, .walker .leg-b {
    transform-box: fill-box;
    transform-origin: 50% 0%;
  }
  .walker .leg-a { animation: walk-a 0.4s linear infinite; }
  .walker .leg-b { animation: walk-b 0.4s linear infinite; }

  @keyframes walk-a {
    0%, 100% { transform: rotate(-22deg); }
    50% { transform: rotate(22deg); }
  }
  @keyframes walk-b {
    0%, 100% { transform: rotate(22deg); }
    50% { transform: rotate(-22deg); }
  }

  .logo-row {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: clamp(42px, 8vw, 78px);
    margin-top: 148px;
  }

  .logo {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 1em;
    margin: 0;
    letter-spacing: 1px;
    line-height: 1;
  }

  /* Reloj exacto original */
  .clock {
    position: relative;
    width: 0.62em;
    height: 0.62em;
    border-radius: 50%;
    background: #fff;
    border: 4px solid var(--ink);
    flex-shrink: 0;
    cursor: pointer;
  }

  .clock .hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    transform-origin: 50% 100%;
    background: var(--ink);
    border-radius: 4px;
  }

  .clock .hand.hour {
    width: 9%;
    height: 26%;
    margin-left: -4.5%;
  }

  .clock .hand.minute {
    width: 6%;
    height: 38%;
    margin-left: -3%;
    background: #E8604C;
  }

  .clock .pin {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 12%;
    height: 12%;
    margin: -6% 0 0 -6%;
    background: var(--ink);
    border-radius: 50%;
  }

  .tagline {
    margin-top: 14px;
    font-size: 18px;
    color: var(--ink);
    opacity: 0.6;
    font-weight: 500;
  }

  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  @media (max-width: 800px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 540px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    display: block;
    background: #fff;
    border: 2px solid var(--card-border);
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    text-decoration: none;
    color: var(--ink);
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.12);
  }

  .card-image {
    width: 100%;
    height: 150px;
    background: #F4F4F4;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-image .placeholder {
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    color: #9a9a9a;
  }

  .card-title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 20px;
    text-align: center;
    padding: 14px 12px;
  }

  .card.soon {
    cursor: default;
    border-style: dashed;
    border-color: #c7c7c7;
    box-shadow: none;
  }
  .card.soon:hover {
    transform: none;
    box-shadow: none;
  }
  .card.soon .card-image {
    background: #FAFAFA;
  }
  .card.soon .card-title {
    color: #a9a9a9;
  }
</style>
</head>
<body>

  <header>
    <div class="lamp-anchor" id="lampAnchor"></div>
    <div class="lamp" id="lamp">
      <div class="bulb-wrap" id="bulbWrap">
        <div class="bulb-cap"></div>
        <div class="bulb-glass" id="bulbGlass"></div>
      </div>
    </div>
    <div class="light-cone" id="lightCone"></div>
    <div class="logo-row">
      <span class="side-joke" id="sideJokeLeft">psst</span>
      <h1 class="logo">FCIIN</h1>
      <div class="clock" id="clock">
        <div class="hand hour" id="hourHand"></div>
        <div class="hand minute" id="minuteHand"></div>
        <div class="pin"></div>
      </div>
      <h1 class="logo">io</h1>
      <span class="side-joke" id="sideJokeRight">¡boo!</span>
    </div>
    <p class="tagline">games and stuff made by FCIIN</p>
  </header>

  <main class="grid">
    <a class="card" href="veoveo/" target="_blank" rel="noopener">
      <div class="card-image">
        <img src="veoveo-thumb.png" alt="Veo o Veo" onerror="this.style.display='none'; this.parentElement.querySelector('.placeholder').style.display='block';">
        <span class="placeholder" style="display:none;">Sube veoveo-thumb.png</span>
      </div>
      <div class="card-title">Veo o Veo</div>
    </a>
    <div class="card soon">
      <div class="card-image"><span class="placeholder">Próximamente</span></div>
      <div class="card-title">Próximamente</div>
    </div>
    <div class="card soon">
      <div class="card-image"><span class="placeholder">Próximamente</span></div>
      <div class="card-title">Próximamente</div>
    </div>
  </main>

  <div class="falling-bulb" id="fallingBulb">
    <div class="broken-wire"></div>
    <div class="bulb-cap"></div>
    <div class="bulb-glass"></div>
  </div>

  <div class="walker" id="walker">
    <svg viewBox="0 0 24 36">
      <circle cx="12" cy="6" r="5" fill="#1B1B1B"></circle>
      <line x1="12" y1="11" x2="12" y2="24" stroke="#1B1B1B" stroke-width="2"></line>
      <line x1="12" y1="15" x2="6" y2="20" stroke="#1B1B1B" stroke-width="2"></line>
      <line x1="12" y1="15" x2="18" y2="20" stroke="#1B1B1B" stroke-width="2"></line>
      <line class="leg-a" x1="12" y1="24" x2="7" y2="34" stroke="#1B1B1B" stroke-width="2"></line>
      <line class="leg-b" x1="12" y1="24" x2="17" y2="34" stroke="#1B1B1B" stroke-width="2"></line>
    </svg>
  </div>

<script>
(function() {
  const clock = document.getElementById('clock');
  const hourHand = document.getElementById('hourHand');
  const minuteHand = document.getElementById('minuteHand');

  const now = new Date();
  const startHours = now.getHours();
  const startMinutes = now.getMinutes();
  const startSeconds = now.getSeconds();

  let minuteAngle = (startMinutes + startSeconds / 60) * 6;
  let hourAngle = ((startHours % 12) + startMinutes / 60) * 30;
  let simulatedMinutesSinceMidnight = startHours * 60 + startMinutes + startSeconds / 60;

  let previousCursorAngle = null;

  function applyHands() {
    hourHand.style.transform = 'rotate(' + hourAngle + 'deg)';
    minuteHand.style.transform = 'rotate(' + minuteAngle + 'deg)';
  }

  function applyBackground() {
    const hourOfDay = (simulatedMinutesSinceMidnight / 60) % 24;
    const normalizedHour = ((hourOfDay % 24) + 24) % 24;
    const brightness = (Math.cos(((normalizedHour - 12) / 12) * Math.PI) + 1) / 2;

    const night = [16, 19, 33];
    const day = [237, 238, 243];

    const r = Math.round(night[0] + (day[0] - night[0]) * brightness);
    const g = Math.round(night[1] + (day[1] - night[1]) * brightness);
    const b = Math.round(night[2] + (day[2] - night[2]) * brightness);

    document.body.style.backgroundColor = 'rgb(' + r + ',' + g + ',' + b + ')';

    updateLampState(brightness);
  }

  const NIGHT_THRESHOLD = 0.35;
  let isNight = false;
  let isBroken = false;
  let blinkTimeoutIds = [];

  function setBulbVisual(on) {
    if (isBroken) on = false; // Bloqueo: si está rota, se apaga totalmente
    document.body.classList.toggle('lamp-on', on);
  }

  function clearBlinkTimeouts() {
    blinkTimeoutIds.forEach(clearTimeout);
    blinkTimeoutIds = [];
  }

  function startBlinkSequence() {
    if (isBroken) return;
    clearBlinkTimeouts();
    const sequence = [
      [true, 0],
      [false, 120],
      [true, 180],
      [false, 100],
      [true, 220]
    ];
    let delay = 0;
    sequence.forEach(function(step) {
      delay += step[1];
      blinkTimeoutIds.push(setTimeout(function() { setBulbVisual(step[0]); }, delay));
    });
  }

  function updateLampState(brightness) {
    if (isBroken) return;
    const nowIsNight = brightness < NIGHT_THRESHOLD;
    if (nowIsNight && !isNight) {
      isNight = true;
      startBlinkSequence();
    } else if (!nowIsNight && isNight) {
      isNight = false;
      clearBlinkTimeouts();
      setBulbVisual(false);
    }
  }

  setInterval(function() {
    if (isNight && !isBroken) {
      setBulbVisual(false);
      setTimeout(function() { if (isNight && !isBroken) setBulbVisual(true); }, 400);
    }
  }, 30000);

  applyHands();
  applyBackground();

  /* --- Péndulo y física --- */
  const lamp = document.getElementById('lamp');
  const lampAnchor = document.getElementById('lampAnchor');
  const bulbWrap = document.getElementById('bulbWrap');
  const lightCone = document.getElementById('lightCone');
  const fallingBulb = document.getElementById('fallingBulb');

  const WIRE_LEN = 78;
  const GRAVITY = 1600;
  const DAMPING = 1.1;
  const MAX_ANGLE = 1.3;
  const BREAK_SPEED = 9;
  const WALL_MARGIN = 24;
  const FALL_GRAVITY = 2200;
  const BULB_TOTAL_H = 53;
  const BULB_W = 26;

  let angle = 0;
  let angularVelocity = 0;
  let isDragging = false;
  let lastDragAngle = 0;
  let lastDragTime = 0;
  let lastFrameTime = null;

  function getAnchorPoint() {
    const rect = lampAnchor.getBoundingClientRect();
    return { x: rect.left, y: rect.top };
  }

  function renderLamp() {
    const deg = angle * 180 / Math.PI;
    lamp.style.transform = 'rotate(' + deg + 'deg)';
    lightCone.style.transform = 'rotate(' + deg + 'deg)';

    const anchor = getAnchorPoint();
    const bulbX = anchor.x - WIRE_LEN * Math.sin(angle);
    if (bulbX < WALL_MARGIN || bulbX > window.innerWidth - WALL_MARGIN) {
      breakWire();
    }
  }

  function angleFromPointer(clientX, clientY) {
    const anchor = getAnchorPoint();
    const dx = clientX - anchor.x;
    const dy = clientY - anchor.y;
    let a = Math.atan2(-dx, dy);
    if (a > MAX_ANGLE) a = MAX_ANGLE;
    if (a < -MAX_ANGLE) a = -MAX_ANGLE;
    return a;
  }

  function startDrag(clientX, clientY) {
    if (isBroken) return;
    isDragging = true;
    angularVelocity = 0;
    angle = angleFromPointer(clientX, clientY);
    lastDragAngle = angle;
    lastDragTime = performance.now();
    renderLamp();
  }

  function moveDrag(clientX, clientY) {
    if (!isDragging || isBroken) return;
    const now = performance.now();
    const newAngle = angleFromPointer(clientX, clientY);
    const dt = Math.max((now - lastDragTime) / 1000, 0.001);
    angularVelocity = (newAngle - lastDragAngle) / dt;
    angle = newAngle;
    lastDragAngle = newAngle;
    lastDragTime = now;
    renderLamp();

    if (!isBroken && Math.abs(angularVelocity) > BREAK_SPEED) {
      breakWire();
    }
  }

  function endDrag() {
    isDragging = false;
  }

  function breakWire() {
    if (isBroken) return;
    isBroken = true;
    isDragging = false;
    setBulbVisual(false);

    const anchor = getAnchorPoint();
    const breakX = anchor.x - WIRE_LEN * Math.sin(angle) + window.scrollX;
    const breakY = anchor.y + WIRE_LEN * Math.cos(angle) + window.scrollY;

    const vx = angularVelocity * WIRE_LEN * -Math.cos(angle);
    const vy = angularVelocity * WIRE_LEN * -Math.sin(angle);

    angle = 0;
    angularVelocity = 0;
    lamp.classList.add('broken');
    lamp.style.transform = 'rotate(0deg)';
    bulbWrap.style.display = 'none';
    lightCone.style.display = 'none';

    fallingBulb.style.display = 'block';
    startFall(breakX, breakY, vx, vy);
  }

  bulbWrap.addEventListener('mousedown', function(e) {
    e.preventDefault();
    startDrag(e.clientX, e.clientY);
  });
  document.addEventListener('mousemove', function(e) {
    moveDrag(e.clientX, e.clientY);
  });
  document.addEventListener('mouseup', endDrag);

  bulbWrap.addEventListener('touchstart', function(e) {
    const t = e.touches[0];
    startDrag(t.clientX, t.clientY);
  }, { passive: true });
  document.addEventListener('touchmove', function(e) {
    if (!isDragging) return;
    const t = e.touches[0];
    moveDrag(t.clientX, t.clientY);
  }, { passive: true });
  document.addEventListener('touchend', endDrag);

  function physicsTick(timestamp) {
    if (lastFrameTime === null) lastFrameTime = timestamp;
    const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.05);
    lastFrameTime = timestamp;

    if (!isDragging && !isBroken) {
      const angularAcceleration = -(GRAVITY / WIRE_LEN) * Math.sin(angle) - DAMPING * angularVelocity;
      angularVelocity += angularAcceleration * dt;
      angle += angularVelocity * dt;
      renderLamp();
    }

    updateTitleGlow();
    requestAnimationFrame(physicsTick);
  }
  requestAnimationFrame(physicsTick);

  /* --- Sistema de iluminación sobre el título --- */
  const glowPairs = Array.prototype.map.call(document.querySelectorAll('.logo'), function(el) {
    const glow = el.cloneNode(true);
    glow.classList.add('logo-glow');
    glow.setAttribute('aria-hidden', 'true');
    document.body.appendChild(glow);
    return { original: el, glow: glow };
  });

  const sideJokeLeft = document.getElementById('sideJokeLeft');
  const sideJokeRight = document.getElementById('sideJokeRight');

  function updateTitleGlow() {
    const lit = document.body.classList.contains('lamp-on') && !isBroken;
    const coneRect = lit ? lightCone.getBoundingClientRect() : null;

    glowPairs.forEach(function(pair) {
      const rect = pair.original.getBoundingClientRect();
      pair.glow.style.left = rect.left + 'px';
      pair.glow.style.top = rect.top + 'px';
      pair.glow.style.fontSize = window.getComputedStyle(pair.original).fontSize;

      if (!lit) {
        pair.glow.style.clipPath = 'inset(0 0 100% 0)';
        return;
      }

      const left = Math.max(rect.left, coneRect.left);
      const right = Math.min(rect.right, coneRect.right);
      const top = Math.max(rect.top, coneRect.top);
      const bottom = Math.min(rect.bottom, coneRect.bottom);

      if (right <= left || bottom <= top) {
        pair.glow.style.clipPath = 'inset(0 0 100% 0)';
        return;
      }

      const insetTop = top - rect.top;
      const insetRight = rect.right - right;
      const insetBottom = rect.bottom - bottom;
      const insetLeft = left - rect.left;

      pair.glow.style.clipPath = 'inset(' + insetTop + 'px ' + insetRight + 'px ' + insetBottom + 'px ' + insetLeft + 'px)';
    });

    [sideJokeLeft, sideJokeRight].forEach(function(el) {
      if (!lit) { el.style.opacity = 0; return; }
      const r = el.getBoundingClientRect();
      const overlaps = !(r.right < coneRect.left || r.left > coneRect.right || r.bottom < coneRect.top || r.top > coneRect.bottom);
      el.style.opacity = overlaps ? 1 : 0;
    });
  }

  /* --- Caída de la bombilla al suelo total de la web --- */
  let fallX = 0, fallY = 0, fallVX = 0, fallVY = 0;
  let fallLanded = false;
  let lastFallTime = null;
  let pageFloor = 0;

  function startFall(x, y, vx, vy) {
    fallX = x - BULB_W / 2;
    fallY = y;
    fallVX = vx;
    fallVY = vy;
    fallLanded = false;
    lastFallTime = null;

    // Calcula la altura total de la web al romper (sin crear bucle infinito)
    pageFloor = Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight,
      window.innerHeight
    );

    positionFallingBulb();
    requestAnimationFrame(fallTick);
  }

  function positionFallingBulb() {
    fallingBulb.style.left = fallX + 'px';
    fallingBulb.style.top = fallY + 'px';
  }

  function fallTick(timestamp) {
    if (fallLanded) return;
    if (lastFallTime === null) lastFallTime = timestamp;
    const dt = Math.min((timestamp - lastFallTime) / 1000, 0.05);
    lastFallTime = timestamp;

    fallVY += FALL_GRAVITY * dt;
    fallX += fallVX * dt;
    fallY += fallVY * dt;

    if (fallY + BULB_TOTAL_H >= pageFloor - 12) {
      fallY = pageFloor - BULB_TOTAL_H - 12;
      fallVY = 0;
      fallVX = 0;
      fallLanded = true;
      positionFallingBulb();
      onBulbLanded();
      return;
    }

    positionFallingBulb();
    requestAnimationFrame(fallTick);
  }

  /* --- Monigote en el suelo --- */
  const walker = document.getElementById('walker');
  const WALK_SPEED = 140;
  const WALKER_W = 24;
  const WALKER_H = 36;

  let walkerX = 0;
  let walkerTargetX = 0;
  let walkerPhase = null;
  let lastWalkerTime = null;

  function onBulbLanded() {
    setTimeout(function() {
      spawnWalker(fallX + BULB_W / 2);
    }, 1200);
  }

  function positionWalker() {
    walker.style.left = walkerX + 'px';
    walker.style.top = (pageFloor - WALKER_H - 12) + 'px'; // En el suelo absoluto de la web
  }

  function spawnWalker(bulbDocX) {
    walkerX = -WALKER_W - 20;
    walker.style.display = 'block';
    positionWalker();
    walkerPhase = 'approach';
    walkerTargetX = bulbDocX - WALKER_W / 2;
    lastWalkerTime = null;
    requestAnimationFrame(walkerTick);
  }

  function walkerTick(timestamp) {
    if (lastWalkerTime === null) lastWalkerTime = timestamp;
    const dt = Math.min((timestamp - lastWalkerTime) / 1000, 0.05);
    lastWalkerTime = timestamp;

    const dir = walkerTargetX >= walkerX ? 1 : -1;
    walkerX += WALK_SPEED * dt * dir;
    const reached = (dir > 0 && walkerX >= walkerTargetX) || (dir < 0 && walkerX <= walkerTargetX);

    if (reached) {
      walkerX = walkerTargetX;
      positionWalker();

      if (walkerPhase === 'approach') {
        fallingBulb.style.display = 'none';
        walkerPhase = 'carry';
        walkerTargetX = window.innerWidth + WALKER_W + 20;
        lastWalkerTime = null;
        requestAnimationFrame(walkerTick);
      } else {
        walker.style.display = 'none';
      }
      return;
    }

    positionWalker();
    requestAnimationFrame(walkerTick);
  }

  /* --- Reloj manual --- */
  document.addEventListener('mousemove', function(e) {
    const rect = clock.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    const dx = e.clientX - cx;
    const dy = e.clientY - cy;

    let angle = Math.atan2(dx, -dy) * (180 / Math.PI);
    if (angle < 0) angle += 360;

    if (previousCursorAngle !== null) {
      let delta = angle - previousCursorAngle;
      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;

      minuteAngle = angle;
      hourAngle = (hourAngle + delta / 12 + 360) % 360;
      simulatedMinutesSinceMidnight += delta / 6;

      applyHands();
      applyBackground();
    }

    previousCursorAngle = angle;
  });
})();
</script>
